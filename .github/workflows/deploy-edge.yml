# Builds the server engine from source and deploys the edt-engine Edge Function to Supabase.
# Requires the repository secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
name: Deploy server engine

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'scripts/build-edge.mjs'
      - '.github/workflows/deploy-edge.yml'
  workflow_dispatch:

concurrency:
  group: deploy-edge
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Engine and server tests
        run: npm test
      - name: Build engine bundle
        run: npm run build:edge
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy edt-engine
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set; skipping deployment."
            exit 0
          fi
          supabase functions deploy edt-engine --project-ref aczupeihejdguwipqcfz --no-verify-jwt --use-api
